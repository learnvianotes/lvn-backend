# Local services for lvn-backend (spec §2, §16.1): PostgreSQL 16 + pgvector, Redis 7, S3-compatible storage
# (RustFS, ADR-0032) and Mailpit for email. Host ports avoid the defaults so other projects on the same machine keep
# theirs; the apps read every URL from .env (ADR-0022), which points at these ports.
#
#   docker compose -f infra/docker/compose.yaml up -d      (or: pnpm infra:up)
name: lvn

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lvn
      POSTGRES_PASSWORD: lvn
      POSTGRES_DB: lvn
    ports: ["${LVN_POSTGRES_PORT:-55432}:5432"]
    volumes: [postgres:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lvn -d lvn"]
      interval: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["${LVN_REDIS_PORT:-56379}:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      retries: 30

  # S3 API on :59000, web console on :59001. Buckets are created by the API in development (StorageService).
  s3:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_ACCESS_KEY: lvn-dev
      RUSTFS_SECRET_KEY: lvn-dev-secret
    ports: ["${LVN_S3_PORT:-59000}:9000", "${LVN_S3_CONSOLE_PORT:-59001}:9001"]
    volumes: [s3:/data]

  # SMTP on :51025; every email the API sends is readable at http://localhost:58025.
  mailpit:
    image: axllent/mailpit:v1.31.4
    ports: ["${LVN_SMTP_PORT:-51025}:1025", "${LVN_MAILPIT_PORT:-58025}:8025"]

volumes:
  postgres:
  s3:
