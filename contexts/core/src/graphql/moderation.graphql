# Moderation (spec §15.1, ADR-0037): reports, the platform queue, decisions and appeals. A note's own moderation state
# is a field of Note in the notes subgraph.

scalar UUID

"A person, owned by the users subgraph"
type User @key(fields: "id", resolvable: false) {
  id: UUID!
}

type PageInfo @shareable {
  hasNextPage: Boolean!
  endCursor: String
}

enum ErrorCode { UNAUTHENTICATED FORBIDDEN NOT_FOUND VALIDATION CONFLICT RATE_LIMITED INTERNAL }

type UserError @shareable {
  field: [String!]
  message: String!
  code: ErrorCode!
}

type OkPayload @shareable {
  ok: Boolean!
  userErrors: [UserError!]!
}

enum ModerationState { OK PENDING_REVIEW HIDDEN REMOVED }
enum ReportEntityType { NOTE USER COMMENT GROUP_POST CLASSROOM_POST DOUBT GROUP }
"Whose queue a case is in (ADR-0051)"
enum ModerationScope { PLATFORM GROUP CLASSROOM }
enum ReportReason { HARASSMENT SEXUAL SELF_HARM HATE SPAM COPYRIGHT OTHER }
"APPROVE frees a held note, puts back hidden or removed content and removed groups, and lifts a suspension; HIDE and REMOVE take it off for everyone but its author; DISMISS closes reports; WARN tells the author; SUSPEND (accounts only, platform admins, ADR-0053) stops an account reaching others for suspendDays"
enum ModerationActionType { APPROVE HIDE REMOVE WARN SUSPEND DISMISS }

input ReportContentInput {
  entityType: ReportEntityType!
  entityId: UUID!
  reason: ReportReason!
  "What is wrong, in the reporter's words (at most 1,000 characters)"
  details: String
}

input ModerateContentInput {
  entityType: ReportEntityType!
  entityId: UUID!
  action: ModerationActionType!
  "Required for HIDE, REMOVE, WARN and SUSPEND: the author is told"
  reason: String
  "SUSPEND: for how many days, 1 to 365"
  suspendDays: Int
}

"A group's or class's queue for its moderators; without it, platform admins see every case"
input ModerationScopeInput {
  scope: ModerationScope!
  "The group or class"
  id: UUID
}

input AppealModerationInput {
  entityType: ReportEntityType!
  entityId: UUID!
  message: String!
}

type ModerationReport {
  reason: ReportReason!
  details: String
  "null when the scorer held the content on its way to the public"
  reporter: User
  createdAt: DateTime!
}

type ModerationAppeal {
  message: String!
  createdAt: DateTime!
}

"A note as moderators see it: the published version readers would see"
type ModeratedNote {
  id: UUID!
  title: String!
  excerpt: String!
  owner: User!
  visibility: String!
  moderation: ModerationState!
  moderationReason: String
  deleted: Boolean!
}

"A comment, post, announcement or doubt as its scope's moderators see it"
type ModeratedContent {
  entityType: ReportEntityType!
  id: UUID!
  author: User!
  "The start of its text"
  excerpt: String!
  moderation: ModerationState!
  moderationReason: String
  deleted: Boolean!
  "Where it is, in the app"
  path: String!
}

type ModerationCase {
  entityType: ReportEntityType!
  entityId: UUID!
  scope: ModerationScope!
  "The group or class, for those scopes"
  scopeId: UUID
  "Set for NOTE cases"
  note: ModeratedNote
  "Set for COMMENT, GROUP_POST, CLASSROOM_POST and DOUBT cases"
  content: ModeratedContent
  "Set for GROUP cases"
  group: Group
  "Set for USER cases"
  user: User
  "USER cases: until when the account is suspended, if it is"
  suspendedUntil: DateTime
  "GROUP cases of a group platform moderators removed (ADR-0053)"
  removedGroup: RemovedGroup
  reports: [ModerationReport!]!
  appeal: ModerationAppeal
  openedAt: DateTime!
}

type ModerationCaseEdge {
  cursor: String!
  node: ModerationCase!
}

type ModerationCaseConnection {
  edges: [ModerationCaseEdge!]!
  pageInfo: PageInfo!
}

"A warning platform moderators gave an account (ADR-0053)"
type AccountWarning {
  reason: String!
  at: DateTime!
}

"An account's standing, for its owner alone (ADR-0053)"
type AccountStanding {
  "Set while the account is suspended: nothing it does reaches other people until then"
  suspendedUntil: DateTime
  suspensionReason: String
  "The suspension can still be appealed (once)"
  canAppeal: Boolean!
  "Warnings from the last 90 days, newest first"
  warnings: [AccountWarning!]!
}

"A group platform moderators removed (ADR-0053): its owner reads why and may appeal once"
type RemovedGroup {
  id: UUID!
  name: String!
  reason: String!
  removedAt: DateTime!
  canAppeal: Boolean!
}

extend type Query {
  "Open cases, oldest first: a group's (its moderators and mentor) or a class's (its staff), or every case (PLATFORM_ADMIN)"
  moderationQueue(first: Int, after: String, scope: ModerationScopeInput): ModerationCaseConnection!
  "The viewer's account standing: a suspension and recent warnings (ADR-0053)"
  myStanding: AccountStanding!
  "Its owner only: a group platform moderators removed, with why; null for anything else"
  removedGroup(id: UUID!): RemovedGroup
}

extend type Group {
  "Its owner only: the platform moderators' warning about the group from the last 30 days, if any (ADR-0051)"
  moderationWarning: String
}

type Mutation {
  "Report what you can see (a note, a person, a comment, a post, an announcement, a doubt or a group); reporting again updates your report"
  reportContent(input: ReportContentInput!): OkPayload!
  "A moderator's decision on a case: platform admins anywhere, group moderators and class staff in their scope"
  moderateContent(input: ModerateContentInput!): OkPayload!
  "The author's one appeal against hiding or removing their note or content, a group's owner's against its removal, or a suspended person's against the suspension"
  appealModeration(input: AppealModerationInput!): OkPayload!
}
