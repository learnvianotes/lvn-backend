# Achievements, points and contributor levels (ADR-0080): points come only from what other people do with someone's
# public work; achievements mark what they learned or gave. Private unless an adult shows them.

"What an achievement marks"
enum AchievementKind {
  "Topics recalled well and answered right (mastery ≥ 0.8)"
  TOPICS_MASTERED
  "Topics with at least 30 quiz answers, nine in ten right"
  QUIZ_MASTER
  "Exams that reached their Readiness target before the day"
  EXAM_READY
  "Weeks whose planned days were met"
  RHYTHM_WEEKS
  "Points from public notes on one subject"
  SUBJECT_CONTRIBUTOR
}

"A level from points, lost again below its threshold"
enum ContributorLevel {
  NEWCOMER
  "From 50 points"
  CONTRIBUTOR
  "From 250 points: may submit 20 resources a day"
  TRUSTED
}

"An achievement: the highest tier reached of one kind (and subject)"
type Achievement {
  id: UUID!
  kind: AchievementKind!
  "The threshold reached: 5 topics, 12 weeks, 250 points…"
  tier: Int!
  title: String!
  "What it says the person did"
  description: String!
  "For a subject contributor"
  subjectTitle: String
  earnedAt: DateTime!
}

type Contribution {
  "Points from what others did with the person's public work; never below 0"
  points: Int!
  level: ContributorLevel!
  "Points at which the next level starts; null at the top"
  nextLevelAt: Int
}

"What earned points or took them back"
enum PointsRule {
  "Someone reacted to a public note"
  REACTION
  "Someone forked a public note"
  FORK
  "Moderators approved a resource"
  RESOURCE_APPROVED
}

enum PointsSource {
  NOTE
  RESOURCE
}

"A line of the viewer's own points history. Who acted is never told."
type PointsEntry {
  id: UUID!
  "Positive when earned, negative when taken back (a reaction removed, a note no longer public, a resource removed)"
  delta: Int!
  rule: PointsRule!
  sourceType: PointsSource!
  sourceId: UUID!
  subjectTitle: String
  createdAt: DateTime!
}

type PointsEntryEdge {
  cursor: String!
  node: PointsEntry!
}

type PointsEntryConnection {
  edges: [PointsEntryEdge!]!
  pageInfo: PageInfo!
}

type AchievementSettings {
  "Achievements and level shown on the viewer's profile"
  showAchievements: Boolean!
  "Only adults may show them"
  canShow: Boolean!
}

type AchievementSettingsPayload {
  settings: AchievementSettings
  userErrors: [UserError!]!
}

input SetAchievementsShownInput {
  show: Boolean!
}

extend type User {
  "Achievements, the highest tier of each: the viewer's own, or an adult's who shows them; null otherwise"
  achievements: [Achievement!]
  "Points and level, under the same rule as achievements"
  contribution: Contribution
}

extend type Query {
  "The viewer's points history, newest first"
  myPoints(first: Int, after: String): PointsEntryConnection!
  achievementSettings: AchievementSettings!
}

extend type Mutation {
  "Shows or hides the viewer's achievements and level on their profile; refused under 18"
  setAchievementsShown(input: SetAchievementsShownInput!): AchievementSettingsPayload!
}
