# Rule-based recommendations (§14.3, ADR-0071): each with a reason, read through the read rule when asked.

enum RecommendationKind {
  "A topic of an exam in the next 14 days"
  EXAM_TOPIC
  "A weak topic"
  REVISE_TOPIC
  "A note opened in the last 14 days, not today"
  CONTINUE_NOTE
  "A public note with a quiz on a topic read this week"
  QUIZ_ON_TOPIC
  "A public note on the learner's topics that many people read"
  POPULAR_NOTE
}

type Recommendation {
  kind: RecommendationKind!
  "Why, in words"
  reason: String!
  "Higher first; each kind has its band"
  score: Float!
  "The note, for CONTINUE_NOTE, QUIZ_ON_TOPIC and POPULAR_NOTE"
  note: Note
  "Its title as the viewer sees it"
  noteTitle: String
  "The topic key, for EXAM_TOPIC and REVISE_TOPIC"
  topicKey: String
  topic: Topic
  topicTitle: String
}

input DismissRecommendationInput {
  kind: RecommendationKind!
  "The note id or the topic key"
  entityId: String!
}

extend type Query {
  "Signed in only: best first, at most 20 (default 10)"
  recommendations(limit: Int): [Recommendation!]!
}

extend type Mutation {
  "Signed in only: not shown again for 30 days"
  dismissRecommendation(input: DismissRecommendationInput!): OkPayload!
}
