# Project workspaces (ADR-0015, ADR-0048): a group of type PROJECT with a repository card, an ideas board, doubts for
# the mentor, mentors by invitation, and a showcase note that credits the team.

enum GroupPostKind { POST IDEA }
enum DoubtStatus { OPEN ANSWERED RESOLVED }
enum RepositoryProvider { GITHUB GITLAB }

extend type Group {
  "The linked repository, for anyone who sees the workspace"
  repository: GroupRepository
  "Members: the ideas board, most reactions first"
  ideas: [GroupPost!]
  "Members and the mentor: doubts, newest first"
  doubts(status: DoubtStatus, first: Int, after: String): DoubtConnection
  "The viewer's open invite to mentor this workspace"
  viewerMentorInviteId: UUID
  "The note that credits the team; null when there is none or the viewer cannot read it"
  showcase: Note
}

"Public details come from the provider's API when it shows the repository; otherwise the card is the link"
type GroupRepository {
  provider: RepositoryProvider!
  url: String!
  available: Boolean!
  name: String
  description: String
  language: String
  stars: Int
  pushedAt: DateTime
  refreshedAt: DateTime
  "Members, for a GitHub repository while the GitHub App is set up here (ADR-0078); null otherwise"
  app: RepositoryApp
  "Members: the repository's commits, pull requests and issues from the GitHub App, newest first; null for others"
  events(first: Int): [RepositoryEvent!]
}

type RepositoryApp {
  "The App is connected: the repository's activity comes to the workspace"
  connected: Boolean!
  "The workspace's admins, while not connected: where to install the App (for an hour)"
  installUrl: String
}

enum RepositoryEventKind { PUSH PULL_REQUEST ISSUE }

"What happened in the repository: never code, only the title, who, where and when (ADR-0078)"
type RepositoryEvent {
  id: UUID!
  kind: RepositoryEventKind!
  "pushed, opened, closed, merged or reopened"
  action: String!
  "A commit's first line, or a pull request's or issue's title"
  title: String!
  number: Int
  "A GitHub login, not a LearnViaNotes person"
  authorLogin: String
  url: String!
  at: DateTime!
}

"From GitHub's return to the setup page: the install link's state, the installation and the person's code"
input ConnectRepositoryAppInput {
  state: String!
  installationId: String!
  code: String!
}

type DoubtActions {
  answer: Boolean!
  resolve: Boolean!
  reopen: Boolean!
  delete: Boolean!
}

type Doubt {
  id: UUID!
  title: String!
  "Rich text: a card's document"
  body: JSON!
  "A path, line or commit in the repository"
  repoRef: String
  status: DoubtStatus!
  author: User!
  createdAt: DateTime!
  resolvedAt: DateTime
  answerCount: Int!
  "Oldest first"
  answers: [DoubtAnswer!]!
  viewerCan: DoubtActions!
  "Not OK only for its author (ADR-0051)"
  moderation: ModerationState!
  moderationReason: String
  "Its author may still appeal: hidden or removed by a moderator, and not appealed yet"
  moderationCanAppeal: Boolean!
}

type DoubtAnswer {
  id: UUID!
  author: User!
  body: JSON!
  byMentor: Boolean!
  createdAt: DateTime!
}

type DoubtEdge {
  cursor: String!
  node: Doubt!
}

type DoubtConnection {
  edges: [DoubtEdge!]!
  pageInfo: PageInfo!
}

type MentorInviteItem {
  id: UUID!
  group: Group!
  invitedBy: User!
  expiresAt: DateTime!
}

extend type Query {
  "A doubt the viewer's workspace holds"
  doubt(id: UUID!): Doubt
  "Teachers: invites to mentor waiting for an answer"
  myMentorInvites: [MentorInviteItem!]!
}

input SetGroupRepositoryInput {
  groupId: UUID!
  "https://github.com/<owner>/<repo> or https://gitlab.com/<namespace>/<project>; empty unlinks"
  url: String
}

input InviteMentorInput {
  groupId: UUID!
  "A teacher's handle or email"
  person: String!
}

input AnswerMentorInviteInput {
  inviteId: UUID!
  accept: Boolean!
}

input AskDoubtInput {
  groupId: UUID!
  "3 to 200 characters"
  title: String!
  body: JSON!
  repoRef: String
}

input AnswerDoubtInput {
  doubtId: UUID!
  body: JSON!
}

input DoubtIdInput {
  doubtId: UUID!
}

input SetProjectShowcaseInput {
  groupId: UUID!
  "A PUBLIC project note shared to the workspace; null clears it"
  noteId: UUID
}

type DoubtPayload {
  doubt: Doubt
  userErrors: [UserError!]!
}

extend type Mutation {
  "Admins and the Owner"
  setGroupRepository(input: SetGroupRepositoryInput!): GroupPayload!
  "Confirms the person installed the GitHub App and that it covers the workspace's repository, then connects it (ADR-0078)"
  connectRepositoryApp(input: ConnectRepositoryAppInput!): GroupPayload!
  "Stops the repository's activity and deletes what was kept"
  disconnectRepositoryApp(input: GroupIdInput!): GroupPayload!
  "Admins and the Owner invite a teacher; the invite lasts 14 days"
  inviteMentor(input: InviteMentorInput!): GroupPayload!
  answerMentorInvite(input: AnswerMentorInviteInput!): GroupPayload!
  "The team"
  askDoubt(input: AskDoubtInput!): DoubtPayload!
  "The team and the mentor"
  answerDoubt(input: AnswerDoubtInput!): DoubtPayload!
  "The mentor, admins, the Owner or the asker"
  resolveDoubt(input: DoubtIdInput!): DoubtPayload!
  "The asker or the mentor"
  reopenDoubt(input: DoubtIdInput!): DoubtPayload!
  "The asker or a moderator"
  deleteDoubt(input: DoubtIdInput!): GroupPayload!
  "Admins and the Owner"
  setProjectShowcase(input: SetProjectShowcaseInput!): GroupPayload!
}
