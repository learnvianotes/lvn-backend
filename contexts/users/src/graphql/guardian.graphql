# Parent notice and the manage link (ADR-0110). Confirm and manage tokens are public: the signature is the credential.
# Resending a link is signed in, because the caller is the child asking for another email to the stored parent address.

"What a parent sees. Counts and the consent record only: no email address and no note text."
type GuardianChildSummary {
  displayName: String!
  ageYears: Int
  "under_13, 13_15 or 16_17, as recorded at sign-up."
  ageBand: String!
  noticeVersion: String!
  "auto_unverified until the parent clicks confirm. email_plus after that click."
  consentMethod: String!
  "True only when the method currently lifts restricted-minor limits. email_plus needs the click and the admin setting."
  consentVerified: Boolean!
  accountStatus: String!
  notes: Int!
  files: Int!
  deletionScheduledFor: DateTime
}

type GuardianSessionPayload {
  "Present this on the later parent calls until expiresAt. The manage link that produced it cannot be used again."
  sessionToken: String
  expiresAt: DateTime
  summary: GuardianChildSummary
  userErrors: [UserError!]!
}

type GuardianSummaryPayload {
  summary: GuardianChildSummary
  userErrors: [UserError!]!
}

type GuardianExportsPayload {
  exports: [DataExport!]
  userErrors: [UserError!]!
}

extend type Query {
  "The child's summary for a live manage session."
  guardianChildSummary(sessionToken: String!): GuardianSummaryPayload!
  "Data exports already asked for on this account. A ready one includes a short-lived download link."
  guardianDataExports(sessionToken: String!): GuardianExportsPayload!
}

extend type Mutation {
  "The parent clicked the confirm link. Receiving or opening the email does not call this. Sets method email_plus."
  confirmGuardianConsent(token: String!): OkPayload!
  "One use of the manage link. Returns a session for the summary, export, withdrawal and deletion calls."
  redeemGuardianManageLink(token: String!): GuardianSessionPayload!
  "The same archive the account can ask for. One a day."
  guardianRequestDataExport(sessionToken: String!): DataExportPayload!
  "Puts consent back to auto_unverified. Restricted-minor limits apply again. Suspends only when an admin requires consent for access."
  guardianWithdrawConsent(sessionToken: String!): GuardianSummaryPayload!
  "Schedules deletion. confirm must be the word DELETE. There is no child password."
  guardianDeleteAccount(sessionToken: String!, confirm: String!): AccountDeletionPayload!
  "Sends the notice again, with a new confirm link, to the stored parent address. Rate limited. Signed in."
  resendGuardianConfirmLink: OkPayload!
  "Sends a new manage link to the stored parent address. Rate limited. Signed in."
  resendGuardianManageLink: OkPayload!
}
