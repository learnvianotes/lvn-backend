# College ID card verification (ADR-0099). A signed-in student asks platform admins to verify them by sending one
# photo or PDF of their college ID card. Approval uses the existing verification mechanism (method DOCUMENTS).
# The card is stored in the restricted bucket and is never public. General uploads (UPLOADS_ENABLED, ADR-0097) do
# not control this; platform admins do, with setStudentIdVerificationEnabled. While that switch is off, the upload
# and submit mutations answer UNAVAILABLE and store nothing.

"A short-lived upload of one college ID card. PUT the bytes to uploadUrl with exactly these headers within 10 minutes, then call submitStudentIdVerification. Do not call completeUpload."
type StudentIdUpload {
  fileId: UUID!
  uploadUrl: String!
  uploadHeaders: [StudentIdUploadHeader!]!
  expiresAt: DateTime!
}

type StudentIdUploadHeader {
  name: String!
  value: String!
}

type StudentIdUploadPayload {
  upload: StudentIdUpload
  userErrors: [UserError!]!
}

"A college-ID request. `card` is set for a reviewer and null for the student. It is null once the card has been deleted."
type StudentIdVerificationRequest {
  id: UUID!
  status: VerificationRequestStatus!
  message: String
  createdAt: DateTime!
  decidedAt: DateTime
  reason: String
  requester: User!
  card: VerificationDocument
  "The automated reading, once it has run. The ID number is hidden from the student."
  aiCheck: IdCardCheck
}

type StudentIdVerificationPayload {
  request: StudentIdVerificationRequest
  userErrors: [UserError!]!
}

"Platform admins. `updatedAt` is null until someone changes the college-ID switch. The AI switches default off."
type StudentIdVerificationSettings {
  enabled: Boolean!
  updatedAt: DateTime
  "student_id_ai_check. Off until an admin turns it on."
  aiCheckEnabled: Boolean!
  "student_id_ai_auto_approve. Off until an admin turns it on. Never rejects."
  autoApproveOnHighConfidence: Boolean!
  "student_id_ai_confidence_threshold, 50–100. Default 90."
  confidenceThreshold: Int!
  "student_id_image_retention_days. Default 30. A withdrawn card is deleted at once."
  imageRetentionDays: Int!
}

input CreateStudentIdUploadInput {
  "Shown to the reviewing admin; never part of the storage key"
  fileName: String!
  "image/jpeg, image/png, image/webp or application/pdf"
  mimeType: String!
  "At most 5 MB (5242880)"
  sizeBytes: Int!
}

input SubmitStudentIdVerificationInput {
  "The fileId from createStudentIdUploadIntent, after the PUT"
  fileId: UUID!
  message: String
}

input ReviewStudentIdVerificationInput {
  requestId: UUID!
  approve: Boolean!
  "Optional. Shown to the student when you reject."
  reason: String
}

extend type Query {
  "Public. False until a platform admin turns it on. Clients hide the college-ID control while it is false. Independent of uploadsEnabled."
  studentIdVerificationEnabled: Boolean!
  "Signed in: the viewer's latest college-ID request, or null if they have never sent one."
  myStudentIdVerification: StudentIdVerificationRequest
  "Platform admins and managers: every pending college-ID request. A teacher: students of their institution. Oldest first. `after` is the last id seen."
  studentIdVerificationQueue(first: Int, after: UUID): [StudentIdVerificationRequest!]!
  "A reviewer of this card: a 5-minute link. Every view is written to the audit log. The student is refused."
  studentIdCardUrl(requestId: UUID!): SignedUrl!
  "Platform admins: the switch and when it last changed."
  studentIdVerificationSettings: StudentIdVerificationSettings!
}

extend type Mutation {
  "Signed in, unverified, no request already waiting. UNAVAILABLE while the switch is off — nothing is stored."
  createStudentIdUploadIntent(input: CreateStudentIdUploadInput!): StudentIdUploadPayload!
  "Signed in. One pending account-verification request at a time; three requests a week. UNAVAILABLE while the switch is off."
  submitStudentIdVerification(input: SubmitStudentIdVerificationInput!): StudentIdVerificationPayload!
  "The student withdraws their own pending college-ID request. The card is deleted."
  withdrawStudentIdVerification(requestId: UUID!): OkPayload!
  "A reviewer of this request. Approval sets the account verified with method DOCUMENTS. The card is kept until the retention window. A reason is optional."
  reviewStudentIdVerification(input: ReviewStudentIdVerificationInput!): StudentIdVerificationPayload!
  "Platform admins. Does not change UPLOADS_ENABLED. Off is the default."
  setStudentIdVerificationEnabled(enabled: Boolean!): OkPayload!
}
