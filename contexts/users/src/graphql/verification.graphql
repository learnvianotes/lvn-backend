# Verification without an institutional email (ADR-0019) and the interim platform-admin tools (§15.1).

enum VerificationRequestStatus { PENDING APPROVED REJECTED WITHDRAWN }

"ACCOUNT: have the account verified (ADR-0019). TEACHER_ROLE: an application to teach (ADR-0073)"
enum VerificationPurpose { ACCOUNT TEACHER_ROLE }

"Where the viewer stands as a teacher (ADR-0073)"
enum TeacherStatus {
  NONE
  "Applied and waiting: may prepare classes, admits no one yet"
  PENDING
  "The TEACHER role"
  VERIFIED
  "The latest application was declined; may apply again"
  DECLINED
}

extend type User {
  "Viewer only (ADR-0073)"
  teacherStatus: TeacherStatus
}

"Shown to the requester, a verified teacher who was addressed or shares the institution, and platform admins. Documents are listed for those reviewers. Managers cannot review."
type VerificationRequest {
  id: UUID!
  purpose: VerificationPurpose!
  method: VerificationMethod!
  "TEACHER_ROLE: where and what they teach"
  institution: String
  subjects: String
  status: VerificationRequestStatus!
  message: String
  createdAt: DateTime!
  decidedAt: DateTime
  reason: String
  requester: User!
  "TEACHER method: the teacher asked to vouch"
  teacher: User
  "Reviewers who may decide this request. Open one with verificationDocumentUrl (every view is audited)."
  documents: [VerificationDocument!]!
  "True when the proof is one college ID card (ADR-0099). Kept for the retention window after a decision, and deleted at once when withdrawn."
  collegeIdCard: Boolean!
  "The automated reading, once it has run. The ID number is hidden from the student."
  aiCheck: IdCardCheck
}

enum IdCardVerdict { MATCH MISMATCH UNREADABLE }

"Fields read from the document. `idNumber` is null for the student."
type IdCardFields {
  name: String
  institution: String
  idNumber: String
  validUntil: String
}

"match, mismatch or unreadable. A mismatch is never an automatic rejection."
type IdCardCheck {
  verdict: IdCardVerdict!
  confidence: Float
  reason: String
  checkedAt: DateTime!
  extracted: IdCardFields!
}

type VerificationDocument {
  fileId: UUID!
  fileName: String!
  mimeType: String!
  sizeBytes: Int!
}

type SignedUrl {
  url: String!
  expiresAt: DateTime!
}

type VerificationRequestPayload {
  request: VerificationRequest
  userErrors: [UserError!]!
}

input RequestTeacherVerificationInput {
  teacherId: UUID!
  message: String
}

"fileIds uploaded with createUploadIntent(purpose: VERIFICATION_DOCUMENT); seen by reviewers of this request, deleted 30 days after the decision"
input RequestDocumentVerificationInput {
  fileIds: [UUID!]!
  message: String
}

"""
An application to teach (ADR-0073). fileIds: 0–3 proof files uploaded with createUploadIntent(purpose:
VERIFICATION_DOCUMENT), seen by platform admins only, deleted 30 days after the decision
"""
input ApplyToTeachInput {
  institution: String!
  subjects: String
  message: String
  fileIds: [UUID!]
}

input ReviewVerificationRequestInput {
  requestId: UUID!
  approve: Boolean!
  "Required when rejecting"
  reason: String
}

enum DomainReviewStatus { ACADEMIC_QUEUED NEEDS_REVIEW APPROVED REJECTED }

type DomainReview {
  domain: String!
  status: DomainReviewStatus!
  "How many people asked for it"
  requests: Int!
  firstSeenAt: DateTime!
}

input DecideDomainReviewInput {
  domain: String!
  approve: Boolean!
}

input SetGlobalRoleInput {
  userId: UUID!
  role: GlobalRole!
}

extend type Query {
  myVerificationRequests: [VerificationRequest!]!
  "Signed in: the viewer's latest application to teach (ADR-0073)"
  myTeacherApplication: VerificationRequest
  "Verified teachers: student requests addressed to them, and students of their institution. Platform admins: every pending request. Managers, unverified teachers and students are refused. Oldest first; `after` is the last id seen."
  verificationRequestsToReview(first: Int, after: UUID): [VerificationRequest!]!
  "A reviewer of this request: a 15-minute link to one document. The view is written to the audit log."
  verificationDocumentUrl(requestId: UUID!, fileId: UUID!): SignedUrl!
  "Verified teachers whose name or handle matches, to ask one of them for verification"
  teachers(search: String!): [User!]!
  "Platform admins: institutional email domains waiting for review (ADR-0017)"
  domainReviews(status: DomainReviewStatus): [DomainReview!]!
  "Platform admins: the same queue, or every domain of one status. Omit status for domains still waiting."
  institutionDomains(status: DomainReviewStatus, first: Int): [DomainReview!]!
}

extend type Mutation {
  requestTeacherVerification(input: RequestTeacherVerificationInput!): VerificationRequestPayload!
  requestDocumentVerification(input: RequestDocumentVerificationInput!): VerificationRequestPayload!
  "Signed in, not a teacher yet, not a child account: apply to teach (ADR-0073); a teacher applicant until reviewed"
  applyToTeach(input: ApplyToTeachInput!): VerificationRequestPayload!
  withdrawVerificationRequest(requestId: UUID!): OkPayload!
  "Verified teachers: student requests in their scope. Platform admins: all, including teacher applications. A reviewer cannot decide their own request. Managers are refused."
  reviewVerificationRequest(input: ReviewVerificationRequestInput!): VerificationRequestPayload!
  "Platform admins"
  decideDomainReview(input: DecideDomainReviewInput!): OkPayload!
  "Platform admins: approve or reject a domain, including one nobody has asked for yet."
  reviewInstitutionDomain(input: DecideDomainReviewInput!): OkPayload!
  "Platform admins: TEACHER and MANAGER are granted here, not by an email address (§5, ADR-0017). Every change is audited."
  setGlobalRole(input: SetGlobalRoleInput!): OkPayload!
}
