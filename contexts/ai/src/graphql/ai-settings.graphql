# The AI providers page (ADR-0065), for platform admins: connections to Claude, ChatGPT, Gemini, an OpenAI-compatible
# server (a LiteLLM proxy…) or an Ollama; which answers by default; each task's route. Keys go in and never come out.

"Who answers AI calls"
enum AiProviderKind {
  OLLAMA
  OPENAI
  ANTHROPIC
  GEMINI
  "Any server that speaks OpenAI's API: a LiteLLM proxy, OpenRouter, vLLM…"
  OPENAI_COMPATIBLE
}

"What a kind of provider is and can do"
type AiProviderPreset {
  kind: AiProviderKind!
  name: String!
  "null: the connection must give an address"
  defaultBaseUrl: String
  needsKey: Boolean!
  canEmbed: Boolean!
  "Takes recordings (transcription)"
  canHear: Boolean!
  "Private notes may go to it unless an admin says otherwise (a model on our own machine)"
  privateByDefault: Boolean!
  "Hints; a connection test lists what the account has"
  chatModels: [String!]!
  embedModels: [String!]!
}

type AiConnection {
  id: UUID!
  kind: AiProviderKind!
  label: String!
  "null: the kind's own address"
  baseUrl: String
  "A key is saved; it is never shown again"
  hasKey: Boolean!
  "The key's last four characters"
  keyHint: String
  "§10.1's data-processing flag: notes that are not public may go to it (self-hosted, or a zero-retention agreement)"
  mayReceivePrivate: Boolean!
  enabled: Boolean!
  chatModel: String
  embedModel: String
  "Prices of its default models in millionths of a dollar per million tokens; the monthly budget counts them"
  inputMicroUsdPerMTok: Int!
  outputMicroUsdPerMTok: Int!
  embedMicroUsdPerMTok: Int!
  updatedAt: DateTime!
}

"The environment's own provider (AI_PROVIDER), which answers when no connection is chosen"
type AiEnvironmentProvider {
  "null: AI_PROVIDER is none"
  kind: AiProviderKind
  chatModel: String
  embedModel: String
}

"A task sent to a connection and model instead of the default"
type AiTaskRoute {
  task: String!
  "null: the default connection"
  connectionId: UUID
  model: String!
  inputMicroUsdPerMTok: Int!
  outputMicroUsdPerMTok: Int!
}

type AiSettings {
  connections: [AiConnection!]!
  "Answers chats; null: the environment's provider"
  chatConnectionId: UUID
  "Makes embeddings (Ask AI, meaning search); null: the environment's provider"
  embedConnectionId: UUID
  environment: AiEnvironmentProvider!
  routes: [AiTaskRoute!]!
  "Tasks a route can be set for"
  tasks: [String!]!
  presets: [AiProviderPreset!]!
  "AI_KEYS_SECRET is set, so keys can be saved"
  keysCanBeSaved: Boolean!
  spentThisMonthMicroUsd: Int!
  "null: no monthly cap"
  monthlyBudgetMicroUsd: Int
}

type AiConnectionTest {
  ok: Boolean!
  "What happened; the provider's own words when it failed"
  message: String!
  latencyMs: Int!
  "Models the account lists; empty when the provider does not list them"
  models: [String!]!
}

input SaveAiConnectionInput {
  "Absent: a new connection"
  id: UUID
  kind: AiProviderKind!
  label: String!
  baseUrl: String
  "Empty or absent: keep the saved key"
  apiKey: String
  clearApiKey: Boolean
  mayReceivePrivate: Boolean!
  enabled: Boolean!
  chatModel: String
  embedModel: String
  inputMicroUsdPerMTok: Int
  outputMicroUsdPerMTok: Int
  embedMicroUsdPerMTok: Int
}

input AiConnectionIdInput {
  id: UUID!
}

input SetAiDefaultsInput {
  chatConnectionId: UUID
  embedConnectionId: UUID
}

input SaveAiTaskRouteInput {
  task: String!
  "Absent: the default connection"
  connectionId: UUID
  model: String!
  inputMicroUsdPerMTok: Int
  outputMicroUsdPerMTok: Int
}

input AiTaskRouteInput {
  task: String!
}

type AiConnectionPayload {
  connection: AiConnection
  userErrors: [UserError!]!
}

type AiSettingsPayload {
  settings: AiSettings
  userErrors: [UserError!]!
}

"What a listed model is. A picker offers it only when `supports` includes that picker's use."
enum AiModelKind {
  CHAT
  EMBEDDING
  IMAGE
  AUDIO
  REALTIME
  TTS
  MODERATION
  OTHER
}

"""
A select on /admin/ai. IMAGE, TTS, AUDIO, REALTIME and MODERATION stay empty: this app does not call those APIs.
TRANSCRIBE is a recording sent through the chat API, not the audio-transcriptions API.
"""
enum AiModelUse {
  "The connection's chat model, and every task route except embeddings and transcription"
  CHAT
  "The connection's embedding model, and the EMBED route. Embeddings are 768 numbers."
  EMBEDDING
  "The TRANSCRIBE route: a chat model that can hear a recording"
  TRANSCRIBE
  "Image generation. This app does not call it, so the picker is empty."
  IMAGE
  "Speech. This app does not call it, so the picker is empty."
  TTS
  "The audio transcriptions API. This app does not call it, so the picker is empty."
  AUDIO
  "Realtime. This app does not call it, so the picker is empty."
  REALTIME
  "Moderation models. This app does not call them, so the picker is empty."
  MODERATION
}

"One model a connection's account lists"
type AiListedModel {
  "The id the provider uses, sent back as chatModel, embedModel or a route's model"
  id: String!
  kind: AiModelKind!
  "Pickers that offer this model. Empty: listed under `all`, shown in no select."
  supports: [AiModelUse!]!
}

"The models one select offers"
type AiModelPicker {
  use: AiModelUse!
  models: [AiListedModel!]!
}

"Every model a connection lists, and the select for each use"
type AiConnectionModels {
  "Every model the account lists, sorted by id. Nothing is dropped."
  all: [AiListedModel!]!
  "One select per use, in a fixed order. A use this app cannot call has an empty list."
  pickers: [AiModelPicker!]!
}

type AiConnectionTestPayload {
  test: AiConnectionTest
  userErrors: [UserError!]!
}

extend type Query {
  "Platform admins only"
  aiSettings: AiSettings!
  """
  Platform admins only: every model the connection's account lists, and the select for each use.
  `all` keeps every id (paged through when the provider splits the list). `pickers` offers only models this app can
  call for that use. Both are empty when the provider does not list its models, cannot be reached or the key cannot
  be read. Spends no tokens.
  """
  aiConnectionModels(input: AiConnectionIdInput!): AiConnectionModels!
}

extend type Mutation {
  "Platform admins only, as every mutation below"
  saveAiConnection(input: SaveAiConnectionInput!): AiConnectionPayload!
  "Routes through it then use the default connection"
  deleteAiConnection(input: AiConnectionIdInput!): AiSettingsPayload!
  setAiDefaults(input: SetAiDefaultsInput!): AiSettingsPayload!
  testAiConnection(input: AiConnectionIdInput!): AiConnectionTestPayload!
  saveAiTaskRoute(input: SaveAiTaskRouteInput!): AiSettingsPayload!
  deleteAiTaskRoute(input: AiTaskRouteInput!): AiSettingsPayload!
}
