# Converting a PDF into a note (ADR-0025, ADR-0028): the engine reads the PDF and the notes context makes cards, each
# with the page it came from (ADR-0040), to be checked beside the PDF in the reader.

enum PdfConversionStatus {
  QUEUED
  "Counting the pages"
  TRIAGE
  "Reading the layout, tables, pictures and scanned pages"
  PARSING
  "Making the cards"
  MAPPING
  DONE
  FAILED
}

type PdfConversion {
  id: UUID!
  status: PdfConversionStatus!
  "0 to 100"
  progress: Int!
  pages: Int
  "Pages without a text layer, read with OCR"
  scannedPages: Int
  cards: Int
  "Why it failed, in words for people"
  error: String
  "The PDF"
  fileId: UUID!
  "The new note the cards go into"
  note: Note
  createdAt: DateTime!
  finishedAt: DateTime
}

type PdfPagesUsage {
  "Pages converted this month (UTC)"
  used: Int!
  "null when there is no limit"
  limit: Int
}

extend type Note {
  "The latest conversion filling this note, for the person who asked for it"
  pdfConversion: PdfConversion
}

input ConvertPdfInput {
  noteId: UUID!
  "A PDF of the note the viewer can read"
  fileId: UUID!
}

type PdfConversionPayload {
  conversion: PdfConversion
  userErrors: [UserError!]!
}

extend type Query {
  "A conversion the viewer asked for"
  pdfConversion(id: UUID!): PdfConversion
  pdfPagesThisMonth: PdfPagesUsage!
}

extend type Mutation {
  """
  Convert a PDF of a note the viewer can read into a new PRIVATE note of their own (the rule for copies), counted
  against their PDF pages this month; follow it with pdfConversion. One at a time.
  """
  convertPdfToNote(input: ConvertPdfInput!): PdfConversionPayload!
}
