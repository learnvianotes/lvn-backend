# Who can read a note (spec §4.2, §4.4, §5): visibility, user shares and forks.

enum NoteShareRole { EDITOR VIEWER }

"DIRECT: shared with this person; CONNECTIONS: a connection of the owner, who shares with all of them (ADR-0044)"
enum NoteShareSource { DIRECT CONNECTIONS }

"A person a note is shared with; EDITORs work on the draft, VIEWERs read the published version"
type NoteShare {
  user: User!
  role: NoteShareRole!
  source: NoteShareSource!
  createdAt: DateTime!
}

"Where a copy came from (§4.4, ADR-0010). Every reader sees the author; the origin itself only those who can open it."
type ForkCredit {
  author: User!
  note: Note
  title: String
}

"One visibility the owner may set. reason is set only when enabled is false."
type VisibilityChoice {
  visibility: Visibility!
  enabled: Boolean!
  reason: String
}

extend type Note {
  "Owner only: the people the note is shared with; null for anyone else"
  shares: [NoteShare!]
  "Set on a copy of another note; it cannot be removed"
  forkedFrom: ForkCredit
  "Owner only: every connection of the owner reads it, and new connections will too (teachers, ADR-0013)"
  sharedWithConnections: Boolean
  "Owner only: Private, Unlisted and Public, plus Shared while the note is already Shared"
  visibilityChoices: [VisibilityChoice!]
  "Owner only, once the note is published and Unlisted or Public: /n/{slug}-{id}"
  sharePath: String
}

input SetNoteSharedWithConnectionsInput {
  noteId: UUID!
  shared: Boolean!
}

input ChangeNoteVisibilityInput {
  noteId: UUID!
  visibility: Visibility!
}

input ShareNoteInput {
  noteId: UUID!
  "A handle (@asha or asha) or an email address"
  person: String!
  role: NoteShareRole!
}

input UnshareNoteInput {
  noteId: UUID!
  userId: UUID!
}

input SetNoteForkingInput {
  noteId: UUID!
  enabled: Boolean!
}

extend type Query {
  "Notes other people shared with the viewer, most recently changed first"
  sharedWithMe(first: Int, after: String): NoteConnection!
}

extend type Mutation {
  "PRIVATE, SHARED, UNLISTED or PUBLIC (owner). Unlisted and Public need a published version. Public follows the admin setting public_notes_require_verification."
  changeNoteVisibility(input: ChangeNoteVisibilityInput!): NotePayload!
  "Share with one person, or change their role; a PRIVATE note becomes SHARED"
  shareNote(input: ShareNoteInput!): NotePayload!
  unshareNote(input: UnshareNoteInput!): NotePayload!
  "A PRIVATE copy of a note you may fork, credited to its origin; returns the copy"
  forkNote(input: NoteIdInput!): NotePayload!
  "Allow or stop copies of your note"
  setNoteForking(input: SetNoteForkingInput!): NotePayload!
  "Teachers: share with all your connections, live, or stop (people shared with directly keep their access)"
  setNoteSharedWithConnections(input: SetNoteSharedWithConnectionsInput!): NotePayload!
}

"A group, owned by the core subgraph; notes adds what is shared to it (ADR-0045)"
type Group @key(fields: "id") {
  id: UUID!
  "Members only: notes shared to the group that the viewer may open, the most recently shared first"
  sharedNotes(first: Int, after: String): NoteConnection
}

extend type Note {
  "Owner only: the groups the note is shared to"
  groups: [Group!]
}

input NoteGroupInput {
  noteId: UUID!
  groupId: UUID!
}

extend type Mutation {
  "Share your note with a group you are in; a PRIVATE note becomes SHARED"
  shareNoteToGroup(input: NoteGroupInput!): NotePayload!
  unshareNoteFromGroup(input: NoteGroupInput!): NotePayload!
}

"A class, owned by the core subgraph; notes adds what its staff shared to it (ADR-0046)"
type Classroom @key(fields: "id") {
  id: UUID!
  "Members only: notes shared to the class that the viewer may open, the most recently shared first"
  sharedNotes(first: Int, after: String): NoteConnection
}

extend type Note {
  "Owner only: the classes the note is shared to"
  classrooms: [Classroom!]
}

input NoteClassroomInput {
  noteId: UUID!
  classroomId: UUID!
}

extend type Mutation {
  "Class staff: share your note with the class; a PRIVATE note becomes SHARED"
  shareNoteToClassroom(input: NoteClassroomInput!): NotePayload!
  unshareNoteFromClassroom(input: NoteClassroomInput!): NotePayload!
}
