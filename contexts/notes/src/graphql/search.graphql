# Search (§11, ADR-0055, ADR-0056): one field over notes, people, topics, groups and classes. Typesense or Postgres
# answers; clients never know which.

enum SearchScope { NOTES PEOPLE TOPICS GROUPS CLASSROOMS RESOURCES }

"Where a note comes from, for the person searching (ADR-0056)"
enum NoteSource {
  "Their own notes"
  MINE
  "Notes shared with them, directly or through a group or class of theirs"
  SHARED
  "Other people's public notes"
  PUBLIC
}

"Narrows the notes found (and topics, by subject); never widens what the viewer may read"
input SearchFilters {
  "Notes of these kinds"
  kinds: [NoteKind!]
  "Notes about a topic of this subject; topics of this subject"
  subjectId: UUID
  "Notes about this topic"
  topicId: UUID
  "Notes about any of these topics, at most 20 (an exam's topics, ADR-0076)"
  topicIds: [UUID!]
  "Notes by this person"
  authorId: UUID
  "Any of these sources; signed out, only PUBLIC gives anything"
  sources: [NoteSource!]
}

type NoteSearchHit {
  note: Note!
  "Words around the match from the published version; each match is wrapped in U+E000 … U+E001"
  snippet: String!
}

type SearchResults {
  "Only notes the viewer may read, best match first (newest first when filters alone searched)"
  notes: [NoteSearchHit!]!
  "More notes: pass as `after` with the same query and filters; null when there are no more (at most 200 notes)"
  notesCursor: String
  "People past the digital-consent age, by handle, name or (teachers) headline and bio"
  people: [User!]!
  topics: [Topic!]!
  "Signed in: public groups and project workspaces, and private ones the viewer is in"
  groups: [Group!]!
  "Classes the viewer is in"
  classrooms: [Classroom!]!
  "Approved resources, most saved first among equal matches (ADR-0075)"
  resources: [Resource!]!
}

extend type Query {
  """
  At most 100 characters; `first` per kind, 1 to 20 (default 5). With filters the words may be left out: the notes
  the filters allow come newest first. `after` continues the notes of the same search; a continued page has notes
  only. Works signed out too: public notes, people and topics (group and class pages need an account).
  """
  search(query: String!, scopes: [SearchScope!], first: Int, filters: SearchFilters, after: String): SearchResults!
}

"A resource, owned by the core subgraph (ADR-0075)"
type Resource @key(fields: "id", resolvable: false) {
  id: UUID!
}
