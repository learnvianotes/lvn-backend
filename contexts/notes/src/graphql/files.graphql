# Files (spec §8): the upload flow. Subgraph of the `notes` context (ADR-0033).
extend schema @link(url: "https://specs.apollo.dev/federation/v2.6", import: ["@key", "@shareable"])

scalar DateTime
scalar UUID

"Fixed error vocabulary (§6.2)"
enum ErrorCode { UNAUTHENTICATED FORBIDDEN NOT_FOUND VALIDATION CONFLICT RATE_LIMITED INTERNAL UNAVAILABLE UNDER_MINIMUM_AGE AGE_RESTRICTED AI_UNAVAILABLE_FOR_MINOR FEATURE_UNAVAILABLE_FOR_MINOR MINOR_PII_BLOCKED MFA_REQUIRED ADMIN_MFA_REQUIRED }

type UserError @shareable {
  field: [String!]
  message: String!
  code: ErrorCode!
  "Seconds until a RATE_LIMITED caller may retry. Null for every other code."
  retryAfter: Int
  "One address on AGE_RESTRICTED and on a blocked sign-in: SUPPORT_EMAIL (support@learnvianotes.in unless the environment sets another)."
  supportEmail: String
}

type OkPayload @shareable {
  ok: Boolean!
  userErrors: [UserError!]!
}

"What an upload is for. ATTACHMENT is a picture, video, audio, PDF, Word (.doc, .docx), PowerPoint (.ppt, .pptx) or plain-text file for a note you can edit (parentId). PAGE_IMAGE is a PNG or JPEG for a note page (parentId). VOICE_NOTE is audio; parentId is the note when the recording belongs to one, and omitted when it stands alone. Every one of these finishes with completeUpload, so a remote scan still runs."
enum FilePurpose { ATTACHMENT COVER VOICE_NOTE AVATAR IMPORT EXPORT VERIFICATION_DOCUMENT GROUP_PICTURE PAGE_IMAGE }

input CreateUploadIntentInput {
  "Shown to people; never part of the storage key"
  fileName: String!
  mimeType: String!
  sizeBytes: Int!
  purpose: FilePurpose!
  parentId: UUID
}

type UploadHeader {
  name: String!
  value: String!
}

"Upload the bytes with PUT to uploadUrl and exactly these headers within 10 minutes, then call completeUpload."
type UploadIntent {
  fileId: UUID!
  uploadUrl: String!
  uploadHeaders: [UploadHeader!]!
  expiresAt: DateTime!
}

type UploadIntentPayload {
  intent: UploadIntent
  userErrors: [UserError!]!
}

type Query {
  "ADR-0097: whether people may upload files here. Off, clients hide every upload control and createUploadIntent answers UNAVAILABLE."
  uploadsEnabled: Boolean!
}

type Mutation {
  createUploadIntent(input: CreateUploadIntentInput!): UploadIntentPayload!
  "Checks the uploaded bytes (size, magic bytes) and makes the file READY"
  completeUpload(fileId: UUID!): OkPayload!
}
