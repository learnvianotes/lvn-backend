# lvn-backend CI (spec §16.4, ADR-0093): every push and pull request. Integration and e2e tests start their own Postgres,
# Redis, S3 and Mailpit containers (Testcontainers) on the runner's Docker.
name: ci

on:
  pull_request:
  push:
    branches: ['**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      # Media processing tests transcode with the system ffmpeg (ADR-0041).
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      # Every URL and connection string comes from .env (ADR-0022); CI uses the documented development values.
      - run: cp .env.example .env
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm typecheck
      - name: Context boundaries (dependency-cruiser)
        run: pnpm boundaries
      - name: Prisma schema
        run: pnpm prisma:validate
      - name: Client schema is current (contracts/graphql, §17 contract tests)
        run: pnpm graphql:check
      - name: Every configuration variable is documented (§16.1)
        run: pnpm env:check
      - name: Unit, integration and e2e tests (Testcontainers)
        run: pnpm test

  migrations:
    # Migrations apply to an empty database, and prisma/schema.prisma matches them (no drift).
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_USER: lvn, POSTGRES_PASSWORD: lvn, POSTGRES_DB: lvn }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U lvn" --health-interval 2s --health-timeout 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://lvn:lvn@localhost:5432/lvn
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:deploy
      - name: No drift between schema.prisma and the migrated database
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

  image:
    # The backend image (infra/docker/api.Dockerfile): API, worker and migrations from one build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: lvn-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  pdf-engine:
    # The PDF engine (workers/pdf-engine, Python, ADR-0028): lint, format and the tests that need no models.
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: workers/pdf-engine }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { version: 0.11.31 }
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest -m "not models"

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run: { working-directory: infra/terraform }
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with: { terraform_version: 1.9.8 }
      - run: terraform fmt -check -recursive
      - name: Validate the local environment root (Docker on its VM, ADR-0036)
        working-directory: infra/terraform/envs/local
        run: terraform init -backend=false -input=false && terraform validate
      - name: Deploy scripts (shellcheck)
        working-directory: infra
        run: shellcheck -x -P SCRIPTDIR scripts/deploy-local.sh local-vm/vm.sh terraform/run.sh terraform/lib.sh lightsail/deploy.sh lightsail/lvn.sh lightsail/new-secrets.sh
      - name: The Lightsail stack parses (ADR-0096)
        working-directory: infra/lightsail
        run: |
          mkdir -p env && touch env/backend.env env/web.env
          printf 'LVN_API_IMAGE=a\nLVN_WEB_IMAGE=w\nLVN_POSTGRES_PASSWORD=p\nLVN_REDIS_PASSWORD=r\nLVN_SITE_HOSTS=h\nLVN_CANONICAL_HOST=h\nLVN_ACME_EMAIL=e\nCOMPOSE_PROFILES=web\n' > .env
          docker compose config --quiet
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -e LVN_SITE_HOSTS=beta.example.org -e LVN_CANONICAL_HOST=beta.example.org -e LVN_ACME_EMAIL=ops@example.org caddy:2.11.7-alpine caddy validate --config /etc/caddy/Caddyfile

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm audit --prod --audit-level high
