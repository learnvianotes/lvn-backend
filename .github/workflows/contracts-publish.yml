# Publishes @learnvianotes/contracts (imported as @lvn/contracts, ADR-0031) to GitHub Packages when a
# `contracts-v<semver>` tag is pushed (spec §2, §3). The tag must equal contracts/package.json's version.
name: contracts-publish

on:
  push:
    tags: ['contracts-v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm, registry-url: 'https://npm.pkg.github.com' }
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package version
        run: test "contracts-v$(node -p "require('./contracts/package.json').version")" = "$GITHUB_REF_NAME"
      - run: pnpm --filter @learnvianotes/contracts test
      - run: pnpm --filter @learnvianotes/contracts build
      - run: pnpm --filter @learnvianotes/contracts publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
