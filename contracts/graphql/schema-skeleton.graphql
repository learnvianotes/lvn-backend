# LearnViaNotes — GraphQL schema skeleton (Phase 0 draft, for agent sign-off)
#
# Hand-written to agree on shapes before code exists (spec §18 Phase 0). From Phase 1 the schema is
# code-first in each context's subgraph and exported to graphql/supergraph.graphql on every build;
# this file is then deleted. Conventions (§6.2): Relay cursor pagination (max 100), one `input` per
# mutation, payloads with `userErrors`, errors carry extensions.code from ErrorCode.
#
# Owner context of each type is noted as  # [context]

scalar DateTime
scalar UUID
scalar JSON

interface Node {
  id: UUID!
}

type PageInfo {
  hasNextPage: Boolean!
  hasPreviousPage: Boolean!
  startCursor: String
  endCursor: String
}

type UserError {
  "Dotted path of the input field, e.g. input.title"
  field: [String!]
  message: String!
  code: ErrorCode!
}

enum ErrorCode { UNAUTHENTICATED FORBIDDEN NOT_FOUND VALIDATION CONFLICT RATE_LIMITED INTERNAL }
enum Visibility { PRIVATE SHARED PUBLIC }
enum GlobalRole { STUDENT TEACHER MANAGER PLATFORM_ADMIN }
enum NoteRole { OWNER EDITOR VIEWER }
"What a note is presented as (ADR-0014). BLOG, POST and PROJECT are teacher publications; all follow note rules."
enum NoteKind { NOTE BLOG POST PROJECT }
enum CardType { text heading markdown code image video audio file diagram quote callout checklist table question quiz flashcard }
"Providers exchanged through oauthExchange. Google uses signInWithGoogle (ADR-0007)."
enum OAuthProvider { GITHUB LINKEDIN }

# ── users ─────────────────────────────────────────────────────────────────────

type User implements Node {             # [users]
  id: UUID!
  handle: String!
  displayName: String!
  avatarUrl: String
  "Only for the viewer themself"
  email: String
  emailVerified: Boolean!
  "Only for the viewer themself (ADR-0017)"
  institutionalEmail: String
  "The confirmed college or organisation, shown on the profile if the user chooses"
  institution: Institution
  "False until the registration details are given"
  registrationComplete: Boolean!
  profile: StudentProfile
  "Viewer only"
  limits: [Limit!]!
  "Viewer only: data from the old learnvianotes.in site (ADR-0023)"
  legacyImport: LegacyImport
  "Verified by institutional email, a teacher, or platform admins (ADR-0019); null method while unverified"
  verified: Boolean!
  verificationMethod: VerificationMethod
  globalRole: GlobalRole!
  createdAt: DateTime!
}

type Institution { name: String!, verified: Boolean! }

type Session {                          # [users]
  "15-minute RS256 JWT. Web keeps it in memory; mobile in expo-secure-store."
  accessToken: String!
  accessTokenExpiresAt: DateTime!
  "Mobile only — web receives it as an HttpOnly cookie and this field is null."
  refreshToken: String
  user: User!
}

type AuthPayload { session: Session, userErrors: [UserError!]! }
type OkPayload { ok: Boolean!, userErrors: [UserError!]! }

"""
Registration (ADR-0017, ADR-0019): date of birth is required. A college or organisation email is optional; it
receives a 6-digit code. Without one, the user asks a verified teacher or sends documents to platform admins. Until
verified, the account can use the app for itself but not reach other people.
"""
input SignUpInput { email: String!, password: String!, displayName: String!, dateOfBirth: String!, institutionalEmail: String, acceptedTermsVersion: String! }
"After Google sign-in (no signUp call): the same details, collected once"
input CompleteRegistrationInput { displayName: String!, dateOfBirth: String!, institutionalEmail: String, acceptedTermsVersion: String! }
enum VerificationMethod { INSTITUTIONAL_EMAIL TEACHER DOCUMENTS }
enum VerificationRequestStatus { PENDING APPROVED REJECTED WITHDRAWN }
"Shown to the requester, the addressed teacher, and platform admins only. Documents are never exposed here."
type VerificationRequest { id: UUID!, method: VerificationMethod!, status: VerificationRequestStatus!, createdAt: DateTime!, decidedAt: DateTime, reason: String }
input RequestTeacherVerificationInput { teacherId: UUID! }
"fileIds uploaded with createUploadIntent(purpose: VERIFICATION_DOCUMENT); seen by platform admins only, deleted 30 days after the decision"
input RequestDocumentVerificationInput { fileIds: [UUID!]!, message: String }
input ReviewVerificationRequestInput { requestId: UUID!, approve: Boolean!, reason: String }
type VerificationRequestPayload { request: VerificationRequest, userErrors: [UserError!]! }
input VerifyInstitutionalEmailInput { code: String! }
input SignInInput { email: String!, password: String! }
input OAuthExchangeInput { provider: OAuthProvider!, code: String!, codeVerifier: String!, redirectUri: String! }
"Firebase ID token from a Google sign-in; verified by the API and exchanged for an LVN session (ADR-0007)"
input SignInWithGoogleInput { idToken: String! }
input RefreshSessionInput { "Mobile only; web sends the cookie" refreshToken: String }
input VerifyEmailInput { token: String! }
input RequestPasswordResetInput { email: String! }
input ResetPasswordInput { token: String!, password: String! }

# ── notes ─────────────────────────────────────────────────────────────────────

type Subject implements Node { id: UUID!, slug: String!, title: String!, topics(first: Int, after: String): TopicConnection! }   # [notes]
type Topic implements Node { id: UUID!, slug: String!, title: String!, subject: Subject!, parent: Topic }                         # [notes]

type Note implements Node {             # [notes]
  id: UUID!
  slug: String!
  kind: NoteKind!
  title: String!
  owner: User!
  visibility: Visibility!
  "The viewer's role, null if they only read it publicly"
  viewerRole: NoteRole
  topics: [Topic!]!
  "Draft cards for editors; published cards for everyone else (§4.3)"
  cards(first: Int, after: String): CardConnection!
  publishedVersion: NoteVersion
  draftRevision: Int!
  forkingEnabled: Boolean!
  forkedFrom: NoteAttribution
  createdAt: DateTime!
  updatedAt: DateTime!
  publishedAt: DateTime
}

"""
Credit shown to every reader of a fork, on every platform including the public page; the forker cannot remove it
(§4.4, ADR-0010). `note` and `version` are null when the viewer cannot open the origin or it was deleted — the
author is still credited.
"""
type NoteAttribution {
  note: Note
  version: NoteVersion
  "The origin's author; \"Deleted user\" after account deletion (§7.2)"
  ownerDisplayName: String!
  ownerHandle: String
  "False when the origin was deleted or is no longer readable by anyone but its owner"
  originAvailable: Boolean!
}

type Card implements Node {             # [notes]
  id: UUID!
  type: CardType!
  "Fractional index (§13.2)"
  position: String!
  "Tiptap JSON validated per card type by @lvn/contracts/validation"
  content: JSON!
  revision: Int!
}

type NoteVersion implements Node { id: UUID!, number: Int!, createdAt: DateTime! }   # [notes]

type NoteEdge { cursor: String!, node: Note! }
type NoteConnection { edges: [NoteEdge!]!, pageInfo: PageInfo! }
type CardEdge { cursor: String!, node: Card! }
type CardConnection { edges: [CardEdge!]!, pageInfo: PageInfo! }
type TopicEdge { cursor: String!, node: Topic! }
type TopicConnection { edges: [TopicEdge!]!, pageInfo: PageInfo! }

input CreateNoteInput { title: String!, kind: NoteKind = NOTE, topicIds: [UUID!], folderId: UUID }
input UpdateNoteDraftInput { noteId: UUID!, baseRevision: Int!, title: String, cards: [CardDraftInput!] }
input CardDraftInput { id: UUID, type: CardType!, position: String!, content: JSON!, deleted: Boolean }
input PublishNoteInput { noteId: UUID!, visibility: Visibility! }
input ForkNoteInput { noteId: UUID! }
"""
Exactly one target. A teacher shares with another teacher only when connected or co-teaching a classroom;
`toConnections` (teachers only) shares read access with all current connections (ADR-0013).
"""
input ShareNoteInput { noteId: UUID!, userId: UUID, groupId: UUID, classroomId: UUID, toConnections: Boolean, role: NoteRole }

type NotePayload { note: Note, userErrors: [UserError!]! }

# ── files ─────────────────────────────────────────────────────────────────────

enum FilePurpose { ATTACHMENT COVER VOICE_NOTE AVATAR IMPORT EXPORT VERIFICATION_DOCUMENT }
input CreateUploadIntentInput { fileName: String!, mimeType: String!, sizeBytes: Int!, purpose: FilePurpose!, parentId: UUID }
type UploadIntent { fileId: UUID!, uploadUrl: String!, expiresAt: DateTime! }
type UploadIntentPayload { intent: UploadIntent, userErrors: [UserError!]! }

# ── profile, limits, public stats (ADR-0024, ADR-0026, ADR-0027) ───────────────

enum YearOfStudy { YEAR_1 YEAR_2 YEAR_3 YEAR_4 YEAR_5 POSTGRADUATE GRADUATED SCHOOL NOT_STUDYING }
"Used to personalise recommendations and AI help. Department and year appear on the profile only if showOnProfile."
type StudentProfile { department: String, yearOfStudy: YearOfStudy, interests: [Topic!]!, showOnProfile: Boolean! }
input UpdateProfileInput { department: String, yearOfStudy: YearOfStudy, interestTopicIds: [UUID!], showOnProfile: Boolean }
type ProfilePayload { profile: StudentProfile, userErrors: [UserError!]! }

enum LimitKey { STORAGE_BYTES AI_TOKENS_DAILY PDF_PAGES_MONTHLY GROUPS_OWNED GROUP_MEMBERS CLASSROOMS_OWNED CLASSROOM_MEMBERS PROJECT_WORKSPACES EXPORTS_DAILY IMPORTS_DAILY ORG_SEATS NOTES_OWNED AI_REQUESTS_DAILY }
"From the user's plan (only FREE today). limit null = unlimited."
type Limit { key: LimitKey!, limit: Float, used: Float! }

"Anonymous-safe. Exact counts never leave the API; null until the first milestone (1,000)."
type PublicStats { activeLearnersMilestone: Int }

# ── old learnvianotes.in data (ADR-0023) ───────────────────────────────────────

enum LegacyImportStatus { NOT_FOUND AVAILABLE CLAIMED DECLINED }
type LegacyCounts { notes: Int!, completedTopics: Int!, markedProblems: Int!, studyDays: Int!, studyMinutes: Int! }
type LegacyImport { status: LegacyImportStatus!, counts: LegacyCounts, claimedAt: DateTime }
enum ProblemMark { SOLVED REVISIT }
"Progress on /core content — the old site's history plus everything recorded since. topicKey = subjectId/topicId."
type CoreTopicProgress { topicKey: String!, completed: Boolean!, revisit: Boolean!, secondsStudied: Int!, lastStudiedAt: DateTime }
type CoreProblemMark { problemId: String!, mark: ProblemMark! }
type CoreSubjectProgress { subjectId: String!, topics: [CoreTopicProgress!]!, problems: [CoreProblemMark!]! }

# ── AI tasks and the PDF engine (ADR-0025) ─────────────────────────────────────

enum AiTaskType { SUMMARIZE KEY_CONCEPTS EXPLAIN_SIMPLY FLASHCARDS QUIZ PRACTICE_QUESTIONS TRANSLATE FIND_MISTAKES CREATE_NOTES OUTLINE_TO_NOTE }
"Exactly one source. CREATE_NOTES / OUTLINE_TO_NOTE make a note of your own and follow the fork rule."
input RunAiTaskInput { task: AiTaskType!, noteId: UUID, fileId: UUID, targetLanguage: String }
type AiTaskRun { id: UUID!, task: AiTaskType!, status: JobState!, resultNote: Note, startedAt: DateTime! }
type AiTaskPayload { run: AiTaskRun, userErrors: [UserError!]! }
"The PDF must be attached to a note you may fork; the result is a PRIVATE note of yours with credit to the source."
input ConvertPdfInput { fileId: UUID! }
type PdfConversion { id: UUID!, status: JobState!, note: Note, pages: Int!, pagesNeedingReview: [Int!]! }
type PdfConversionPayload { conversion: PdfConversion, userErrors: [UserError!]! }

# ── data: export everything, import notes (ADR-0018) ──────────────────────────

enum JobState { QUEUED RUNNING SUCCEEDED FAILED DEAD }
type DataExport { id: UUID!, status: JobState!, requestedAt: DateTime!, readyAt: DateTime, "Pre-signed, issued per request; valid until expiresAt (7 days)" downloadUrl: String, expiresAt: DateTime }
type NotesImport { id: UUID!, status: JobState!, created: Int!, skipped: Int!, failed: Int!, issues: [String!]! }
"The file is uploaded first with createUploadIntent(purpose: IMPORT)"
input ImportNotesInput { fileId: UUID! }
type DataExportPayload { export: DataExport, userErrors: [UserError!]! }
type NotesImportPayload { import: NotesImport, userErrors: [UserError!]! }

# ── roots ─────────────────────────────────────────────────────────────────────

type Query {
  "The signed-in user, null for anonymous visitors"
  viewer: User
  node(id: UUID!): Node
  note(id: UUID!): Note
  "Anonymous-safe: PUBLIC notes only (§5)"
  publicNote(slug: String!, id: UUID!): Note
  myNotes(first: Int, after: String): NoteConnection!
  myDataExports: [DataExport!]!
  myNotesImports: [NotesImport!]!
  myVerificationRequests: [VerificationRequest!]!
  "Teachers: verification requests addressed to them"
  verificationRequestsToReview(first: Int, after: String): [VerificationRequest!]!
  subjects(first: Int, after: String): [Subject!]!
  publicStats: PublicStats!
  "Signed-in users: their progress on a /core subject (web reads it on /core pages)"
  coreProgress(subjectId: String!): CoreSubjectProgress!
  aiTaskRun(id: UUID!): AiTaskRun
  pdfConversion(id: UUID!): PdfConversion
}

type Mutation {
  # Phase 1 — auth (§7)
  signUp(input: SignUpInput!): AuthPayload!
  completeRegistration(input: CompleteRegistrationInput!): OkPayload!
  verifyInstitutionalEmail(input: VerifyInstitutionalEmailInput!): OkPayload!
  resendInstitutionalEmailCode: OkPayload!
  requestTeacherVerification(input: RequestTeacherVerificationInput!): VerificationRequestPayload!
  requestDocumentVerification(input: RequestDocumentVerificationInput!): VerificationRequestPayload!
  withdrawVerificationRequest(requestId: UUID!): OkPayload!
  "Teachers: requests addressed to them. Platform admins (admin app): all, including documents."
  reviewVerificationRequest(input: ReviewVerificationRequestInput!): VerificationRequestPayload!
  signIn(input: SignInInput!): AuthPayload!
  oauthExchange(input: OAuthExchangeInput!): AuthPayload!
  signInWithGoogle(input: SignInWithGoogleInput!): AuthPayload!
  refreshSession(input: RefreshSessionInput!): AuthPayload!
  signOut: OkPayload!
  verifyEmail(input: VerifyEmailInput!): OkPayload!
  requestPasswordReset(input: RequestPasswordResetInput!): OkPayload!
  resetPassword(input: ResetPasswordInput!): OkPayload!
  # Phase 1 — uploads (§8.1)
  createUploadIntent(input: CreateUploadIntentInput!): UploadIntentPayload!
  completeUpload(fileId: UUID!): OkPayload!
  # Phase 1 — profile and old data (ADR-0023, ADR-0026)
  updateProfile(input: UpdateProfileInput!): ProfilePayload!
  claimLegacyData: OkPayload!
  declineLegacyData: OkPayload!
  # Phase 2 — PDF engine; Phase 5 — AI tasks (ADR-0025)
  convertPdfToNote(input: ConvertPdfInput!): PdfConversionPayload!
  runAiTask(input: RunAiTaskInput!): AiTaskPayload!
  # Phase 2 — data (ADR-0018)
  requestDataExport: DataExportPayload!
  importNotes(input: ImportNotesInput!): NotesImportPayload!
  # Phase 2 — notes (§4)
  createNote(input: CreateNoteInput!): NotePayload!
  updateNoteDraft(input: UpdateNoteDraftInput!): NotePayload!
  publishNote(input: PublishNoteInput!): NotePayload!
  forkNote(input: ForkNoteInput!): NotePayload!
  shareNote(input: ShareNoteInput!): NotePayload!
}

type Subscription {
  notificationReceived: UUID!
  commentAdded(noteId: UUID!): UUID!
  classroomActivity(classroomId: UUID!): UUID!
  noteProcessingStatus(noteId: UUID!): UUID!
}
