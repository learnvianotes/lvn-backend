packages:
  - apps/*
  - contexts/*
  - libs/*
  - contracts

# One graphql-js in the process: Apollo Gateway, the subgraphs and Nest must share its classes.
# Gateway and composition stay on federation-internals 2.14.4 (there is no 2.15 of those packages).
# @apollo/subgraph 2.15 is the graphql-js rewrite and no longer depends on federation-internals;
# the override keeps a single copy. graphql stays on 16: Apollo Server, Gateway, composition and
# subgraph 2.15 all peer on ^16 only. Nest would accept graphql 17; Apollo would not.
overrides:
  graphql: 16.14.2
  '@apollo/subgraph': 2.15.1
  '@apollo/federation-internals': 2.14.4
  # @types/ssh2@1 still asks for @types/node 18. One Node type package for the whole workspace.
  '@types/node': 26.6.6
  # Patched releases of what pnpm audit flags high (CI's audit job): GraphQL Tools under @nestjs/graphql and mysql2
  # under the Prisma CLI. body-parser, multer and undici are the highs left after the Nest 12 / Apollo bump.
  '@graphql-tools/utils': ^12.0.1
  mysql2: ^3.22.0
  body-parser: ^2.4.0
  multer: ^2.5.0
  undici: ^8.12.2
  # @prisma/config 7.10 pins effect 3.20.0 (high: fixed in 3.22.1) and @prisma/dev reaches fast-uri < 3.1.9.
  # Same majors, patched releases. Drop both when Prisma's own pins move past them.
  effect: ^3.22.1
  fast-uri: ^3.1.9

# OpenTelemetry 0.301 / 3.x needs @opentelemetry/api 1.10. @apollo/gateway 2.14 still bundles OpenTelemetry 1.30, whose
# packages cap the api peer below 1.10. The api is backward compatible within 1.x, and traces and metrics (gateway's
# GraphQL spans included) were checked against an OTLP collector on 2026-11-24. Drop when Gateway moves to OTel 2+.
peerDependencyRules:
  allowedVersions:
    '@opentelemetry/api': '1.10'
