packages:
  - apps/*
  - contexts/*
  - libs/*
  - contracts

# One graphql-js in the process: Apollo Gateway, the subgraphs and Nest must share its classes.
# Federation packages stay on one release so the gateway, composition and subgraphs agree.
overrides:
  graphql: 16.14.2
  '@apollo/subgraph': 2.14.4
  '@apollo/federation-internals': 2.14.4
  # @types/ssh2@1 still asks for @types/node 18. One Node type package for the whole workspace.
  '@types/node': 26.6.5
  # Patched releases of what pnpm audit flags high (CI's audit job): GraphQL Tools under @nestjs/graphql and mysql2
  # under the Prisma CLI. body-parser, multer and undici are the highs left after the Nest 12 / Apollo bump.
  '@graphql-tools/utils': ^12.0.1
  mysql2: ^3.22.0
  body-parser: ^2.4.0
  multer: ^2.5.0
  undici: ^8.12.2

auditConfig:
  ignoreGhsas:
    # deepmerge-ts 7 inside @prisma/config (Prisma 7.10 pins it; the fix is in 8): stack exhaustion on deeply nested
    # input. It merges only our own prisma.config.ts in the CLI, never request data. Drop when Prisma moves to 8.
    - GHSA-ggr8-5vv4-36mx
